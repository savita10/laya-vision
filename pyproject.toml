[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "laya-vision"
version = "0.1.0"
description = "Laya with an image input channel: SigLIP visual tokens into the Laya decision model."
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "laya==0.3.24",  # VisionDecisionModel duplicates DecisionModel.forward from this exact version
    "torch",
    "transformers>=4.48.0",
    "safetensors",
    "huggingface_hub",
    "numpy",
]

[tool.setuptools]
packages = ["laya_vision"]
